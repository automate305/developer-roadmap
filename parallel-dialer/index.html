<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A305 Dialer — Agent Workstation</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runs before the bundle so a stored "light" preference doesn't flash
         the default dark theme for a frame. Kept to one localStorage read,
         guarded — a blocked/private-mode read just leaves the default. -->
    <script>
      try {
        var theme = localStorage.getItem('a305-theme');
        if (theme === 'light') document.documentElement.dataset.theme = 'light';
      } catch {}
    </script>
    <script type="module" src="/src/frontend/main.jsx"></script>
  </body>
</html>
